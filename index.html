<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ruta Clara Villavicencio: orientación y apoyo emocional a tu alcance. Encuentra el canal oficial adecuado, con fuente y fecha de verificación." />
    <meta name="theme-color" content="#f5f0e7" />
    <link rel="icon" type="image/png" href="./marca/favicon-64.png" />
    <link rel="apple-touch-icon" href="./marca/icono-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet" />
    <title>Ruta Clara Villavicencio</title>
    <script>
      // Aplica el modo oscuro elegido antes de pintar, para evitar un parpadeo. El modo claro es la base.
      try {
        if (localStorage.getItem('rutaclara.tema') === 'oscuro') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
