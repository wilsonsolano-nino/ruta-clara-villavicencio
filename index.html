<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruta Clara Villavicencio · Orientación y apoyo emocional para jóvenes</title>
    <meta name="description" content="Encuentra con quién hablar en Villavicencio: líneas oficiales de apoyo emocional y lugares de atención en salud mental, cada uno con fuente y fecha de verificación. Sin registro y sin datos personales." />
    <meta name="theme-color" content="#f5f0e7" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ruta Clara Villavicencio" />
    <meta property="og:title" content="Ruta Clara Villavicencio · ¿Con quién puedo hablar?" />
    <meta property="og:description" content="Líneas oficiales de apoyo emocional y lugares de atención en salud mental en Villavicencio, con fuente y fecha de verificación." />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary" />
    <!--
      Cuando haya dominio, agregar aquí (cambiando https://DOMINIO por la dirección real):
      <link rel="canonical" href="https://DOMINIO/" />
      <meta property="og:url" content="https://DOMINIO/" />
      <meta property="og:image" content="https://DOMINIO/marca/icono-512.png" />
      y la línea "Sitemap" en public/robots.txt. Ver LEEME.md, sección SEO.
    -->

    <!-- Datos estructurados: describen la herramienta para los buscadores. No es un servicio de salud. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ruta Clara Villavicencio",
        "description": "Orientador que indica qué canal oficial de apoyo emocional puede atender tu consulta en Villavicencio. No diagnostica ni reemplaza a un servicio de salud.",
        "inLanguage": "es-CO",
        "applicationCategory": "ReferenceApplication",
        "operatingSystem": "Cualquiera (navegador web)",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "COP" },
        "areaServed": { "@type": "City", "name": "Villavicencio, Meta, Colombia" },
        "audience": { "@type": "PeopleAudience", "suggestedMinAge": 14, "suggestedMaxAge": 28 }
      }
    </script>

    <link rel="icon" type="image/png" href="./marca/favicon-64.png" />
    <link rel="apple-touch-icon" href="./marca/icono-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #f5f0e7;
        color: #26332c;
        font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      .carga-inicial {
        max-width: 640px;
        margin: 48px auto;
        padding: 0 20px;
      }
      .carga-inicial h1 {
        margin: 0 0 16px;
        color: #294c3b;
        font-family: Literata, Georgia, serif;
        font-size: clamp(1.75rem, 3.4vw, 2.25rem);
        font-weight: 600;
        line-height: 1.2;
      }
      .carga-inicial p {
        margin: 0;
      }
      .carga-inicial p + p {
        margin-top: 12px;
      }
      .carga-inicial .carga-consejo {
        margin-top: 24px;
        padding: 20px 24px;
        background: #e3eadf;
        border-left: 4px solid #8fae98;
        border-radius: 6px;
      }
      .carga-inicial .carga-consejo-titulo {
        margin-bottom: 8px;
        font-family: Literata, Georgia, serif;
        font-weight: 600;
      }
      .carga-inicial .carga-consejo-cita {
        margin-top: 10px;
        color: #55615a;
        font-style: italic;
      }
      :root[data-theme='dark'] body {
        background: #1d2622;
        color: #efeae0;
      }
      :root[data-theme='dark'] .carga-inicial h1 {
        color: #a3cbb4;
      }
      :root[data-theme='dark'] .carga-inicial .carga-consejo {
        background: #26332c;
        border-left-color: #8fae98;
      }
      :root[data-theme='dark'] .carga-inicial .carga-consejo-cita {
        color: #bdb7ab;
      }
    </style>
    <script>
      // Aplica el modo oscuro elegido antes de pintar, para evitar un parpadeo. El modo claro es la base.
      try {
        if (localStorage.getItem('rutaclara.tema') === 'oscuro') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Texto que leen los buscadores y quien no tenga JavaScript; React lo reemplaza al cargar.
           Sin teléfonos a propósito: los contactos solo se muestran con su verificación vigente. -->
      <main class="carga-inicial" aria-live="polite">
        <h1>Ruta Clara Villavicencio</h1>
        <p>Estamos preparando orientación y apoyo para ti.</p>
        <div class="carga-consejo">
          <p class="carga-consejo-titulo">Un consejo para este momento</p>
          <p>Hablar de lo que sientes puede ayudarte a encontrar apoyo.</p>
          <p class="carga-consejo-cita">"Pedir ayuda es una forma de cuidarte."</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
